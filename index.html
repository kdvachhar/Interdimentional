<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interdimentional</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    display: block;
  }
</style>
</head>
<body>
<canvas id="screen" width="240" height="160" aria-label="Interdimentional title screen"></canvas>

<script>
// GBA resolution, scaled up by whole pixels.
const W = 240, H = 160;
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

function fit() {
  const s = Math.max(1, Math.floor(Math.min(innerWidth / W, innerHeight / H)));
  canvas.style.width = W * s + 'px';
  canvas.style.height = H * s + 'px';
}
addEventListener('resize', fit);
fit();

// ---------- Sound effects (synthesized with Web Audio, no files) ----------
let actx = null, master = null, noiseBuf = null;
function audio() {
  if (!actx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    actx = new AC();
    master = actx.createGain();
    master.gain.value = 0.35;
    master.connect(actx.destination);
    noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
// Browsers only allow sound after the player interacts with the page.
addEventListener('keydown', audio);
addEventListener('mousedown', audio);

function tone({ type = 'square', f0, f1 = f0, dur, vol = 0.2, delay = 0, attack = 0.005 }) {
  const a = audio(); if (!a) return;
  const t = a.currentTime + delay;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + dur + 0.02);
}
function noise({ dur, vol = 0.2, filter = 'lowpass', f0 = 1000, f1 = f0, q = 1, delay = 0, attack = 0.005 }) {
  const a = audio(); if (!a) return;
  const t = a.currentTime + delay;
  const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  src.buffer = noiseBuf;
  src.loop = true;
  f.type = filter; f.Q.value = q;
  f.frequency.setValueAtTime(f0, t);
  f.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f); f.connect(g); g.connect(master);
  src.start(t, Math.random() * 0.5); src.stop(t + dur + 0.02);
}

const sfx = {
  blip: () => tone({ f0: 880, dur: 0.05, vol: 0.08 }),
  select: () => { tone({ f0: 660, dur: 0.06, vol: 0.1 }); tone({ f0: 990, dur: 0.08, vol: 0.1, delay: 0.06 }); },
  confirm: () => [523, 659, 784, 1046].forEach((f, i) => tone({ type: 'triangle', f0: f, dur: 0.12, vol: 0.18, delay: i * 0.06 })),
  back: () => tone({ f0: 440, f1: 220, dur: 0.12, vol: 0.1 }),
  type: (low) => tone({ f0: low ? 300 : 600 + Math.random() * 80, dur: 0.03, vol: 0.07 }),
  voice: (isMom) => tone({ f0: (isMom ? 230 : 340) * (0.9 + Math.random() * 0.25), dur: 0.05, vol: 0.06 }),
  step: (quiet) => {
    noise({ dur: 0.05, vol: quiet ? 0.05 : 0.1, f0: 500, f1: 200 });
    tone({ type: 'sine', f0: 110, f1: 60, dur: 0.05, vol: quiet ? 0.05 : 0.09 });
  },
  jump: () => tone({ f0: 220, f1: 560, dur: 0.14, vol: 0.1 }),
  land: () => { noise({ dur: 0.08, vol: 0.14, f0: 350, f1: 120 }); tone({ type: 'sine', f0: 90, f1: 45, dur: 0.08, vol: 0.12 }); },
  pickup: () => { noise({ dur: 0.18, vol: 0.12, filter: 'bandpass', f0: 1500, f1: 3500, q: 2 }); tone({ type: 'triangle', f0: 784, f1: 1175, dur: 0.12, vol: 0.1, delay: 0.08 }); },
  door: () => {
    noise({ dur: 0.3, vol: 0.06, filter: 'bandpass', f0: 500, f1: 900, q: 6 });
    tone({ type: 'sawtooth', f0: 140, f1: 95, dur: 0.3, vol: 0.04 });
    noise({ dur: 0.1, vol: 0.18, f0: 300, f1: 100, delay: 0.3 });
    tone({ type: 'sine', f0: 80, f1: 40, dur: 0.12, vol: 0.15, delay: 0.3 });
  },
  creak: () => {
    tone({ type: 'sawtooth', f0: 180, f1: 120, dur: 0.6, vol: 0.05, attack: 0.05 });
    noise({ dur: 0.6, vol: 0.05, filter: 'bandpass', f0: 700, f1: 1200, q: 8, attack: 0.05 });
  },
  locked: () => [0, 0.09].forEach(d => { tone({ f0: 1100, dur: 0.04, vol: 0.08, delay: d }); noise({ dur: 0.05, vol: 0.08, filter: 'highpass', f0: 2000, delay: d }); }),
  whoosh: () => noise({ dur: 0.4, vol: 0.15, filter: 'bandpass', f0: 400, f1: 2400, q: 1.5, attack: 0.08 }),
  clang: () => {
    [320, 467, 891, 1230].forEach((f, i) => tone({ type: i % 2 ? 'square' : 'sine', f0: f, f1: f * 0.98, dur: 0.7, vol: 0.06 }));
    noise({ dur: 0.12, vol: 0.2, f0: 2000, f1: 300 });
  },
  ahha: () => {
    tone({ f0: 520, f1: 880, dur: 0.12, vol: 0.12 });
    tone({ f0: 880, f1: 1320, dur: 0.25, vol: 0.12, delay: 0.12 });
    noise({ dur: 0.15, vol: 0.12, f0: 3000, f1: 800 });
  },
  ding: () => { tone({ type: 'sine', f0: 1320, dur: 0.4, vol: 0.15 }); tone({ type: 'sine', f0: 1980, dur: 0.3, vol: 0.08 }); },
  zap: () => {
    const a = audio(); if (!a) return;
    for (let i = 0; i < 8; i++) noise({ dur: 0.12, vol: 0.2, filter: 'highpass', f0: 1500 + Math.random() * 3000, delay: i * 0.09 });
    tone({ type: 'sawtooth', f0: 120, f1: 60, dur: 0.8, vol: 0.12 });
    tone({ type: 'square', f0: 2400, f1: 300, dur: 0.15, vol: 0.08 });
  },
  field: () => {
    const a = audio(); if (!a) return;
    const t = a.currentTime;
    const lfo = a.createOscillator(), lfoGain = a.createGain(), g = a.createGain();
    lfo.frequency.value = 9; lfoGain.gain.value = 0.04;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.08, t + 0.15);
    g.gain.setValueAtTime(0.08, t + 1.2);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.8);
    lfo.connect(lfoGain); lfoGain.connect(g.gain);
    for (const f of [220, 330, 441]) {
      const o = a.createOscillator();
      o.type = 'sine'; o.frequency.value = f;
      o.connect(g); o.start(t); o.stop(t + 1.85);
    }
    g.connect(master);
    lfo.start(t); lfo.stop(t + 1.85);
  },
  drone: () => {
    tone({ type: 'sawtooth', f0: 55, f1: 52, dur: 6.5, vol: 0.05, attack: 1 });
    tone({ type: 'sine', f0: 82, f1: 78, dur: 6.5, vol: 0.06, attack: 1.5 });
  },
  sting: () => {
    [110, 131, 165, 220].forEach(f => tone({ type: 'sawtooth', f0: f, f1: f * 0.97, dur: 2.2, vol: 0.045, attack: 0.02 }));
    noise({ dur: 0.5, vol: 0.18, f0: 1200, f1: 100 });
  },
  raise: () => {
    tone({ type: 'sine', f0: 300, f1: 1200, dur: 1.3, vol: 0.09, attack: 0.3 });
    [1500, 1800, 2250].forEach((f, i) => tone({ type: 'triangle', f0: f, dur: 0.5, vol: 0.04, delay: 0.5 + i * 0.15 }));
  },
  twist: () => {
    noise({ dur: 3.4, vol: 0.2, filter: 'lowpass', f0: 150, f1: 700, attack: 0.6 });
    tone({ type: 'sawtooth', f0: 60, f1: 400, dur: 3.2, vol: 0.06, attack: 0.5 });
    tone({ type: 'sine', f0: 200, f1: 900, dur: 3.2, vol: 0.05, attack: 0.5 });
  },
  spin: () => {
    tone({ type: 'square', f0: 180, f1: 1400, dur: 1.5, vol: 0.05, attack: 0.1 });
    noise({ dur: 1.5, vol: 0.1, filter: 'bandpass', f0: 300, f1: 3000, q: 3, attack: 0.3 });
  },
  vanish: () => {
    // A poof that echoes away.
    for (let i = 0; i < 5; i++) {
      const v = Math.pow(0.5, i), d = i * 0.3;
      noise({ dur: 0.5, vol: 0.22 * v, filter: 'bandpass', f0: 3000, f1: 300, q: 1, delay: d });
      tone({ type: 'sine', f0: 900, f1: 180, dur: 0.5, vol: 0.12 * v, delay: d });
    }
  },
  portal: () => {
    tone({ type: 'sawtooth', f0: 80, f1: 900, dur: 1.2, vol: 0.08, attack: 0.1 });
    noise({ dur: 1.3, vol: 0.12, filter: 'bandpass', f0: 300, f1: 3000, q: 2, attack: 0.2 });
  },
};

// Footstep sounds, timed to the walk animation.
function guySteps(c) {
  const f = Math.floor(c.walkT / 0.08) % 8;
  if (f !== c.stepF && (f === 0 || f === 4)) sfx.step(false);
  c.stepF = f;
}
function momSteps(c) {
  const f = Math.floor(c.walkT / 0.15) % 2;
  if (f !== c.stepF) sfx.step(true);
  c.stepF = f;
}
// Talking "voice" blips as caption text types out.
function voiceBlips(prevShown, shown, text, isMom) {
  for (let i = Math.floor(prevShown); i < Math.floor(shown); i++)
    if (i % 2 === 0 && text[i] !== ' ') sfx.voice(isMom);
}

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const x = c.getContext('2d');
  x.imageSmoothingEnabled = false;
  return [c, x];
}

// 4x4 Bayer matrix for GBA-style dithering.
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => v / 16 - 0.5);
const bayer = (x, y) => BAYER[(y & 3) * 4 + (x & 3)];

// Renders text to a mask grid at the given pixel scale (a number, or [x, y]).
// `bold` widens every stroke by that many pixels.
function textMask(str, scale, gap, bold = 0) {
  const [kx, ky] = Array.isArray(scale) ? scale : [scale, scale];
  const cw = 5 * kx, ch = 7 * ky;
  const w = str.length * (cw + gap) - gap;
  const mask = Array.from({ length: ch }, () => new Uint8Array(w));
  [...str].forEach((c, i) => {
    const g = FONT[c] || FONT[' '];
    for (let gy = 0; gy < 7; gy++)
      for (let gx = 0; gx < 5; gx++)
        if (g[gy][gx] === '#')
          for (let sy = 0; sy < ky; sy++)
            for (let sx = 0; sx < kx; sx++)
              mask[gy * ky + sy][i * (cw + gap) + gx * kx + sx] = 1;
  });
  for (let b = 0; b < bold; b++)
    for (const row of mask)
      for (let x = w - 1; x > 0; x--) if (row[x - 1]) row[x] = 1;
  return { mask, w, h: ch };
}

// Draws a mask with a 1px outline, optional drop shadow and per-row fill colors.
function renderText(str, { scale = 1, gap = 1, bold = 0, rows, outline = '#080818', shadow, highlight }) {
  const { mask, w, h } = textMask(str, scale, gap, bold);
  const pad = 3;
  const [c, x] = makeCanvas(w + pad * 2, h + pad * 2);
  const on = (mx, my) => my >= 0 && my < h && mx >= 0 && mx < w && mask[my][mx];
  const px = (mx, my, col) => { x.fillStyle = col; x.fillRect(mx + pad, my + pad, 1, 1); };
  if (shadow)
    for (let my = -1; my <= h + 1; my++) for (let mx = -1; mx <= w + 1; mx++)
      if (on(mx - 2, my - 2) || on(mx - 1, my - 2) || on(mx - 2, my - 1)) px(mx, my, shadow);
  if (outline) for (let my = -1; my <= h; my++) for (let mx = -1; mx <= w; mx++)
    if (!on(mx, my) && (on(mx - 1, my) || on(mx + 1, my) || on(mx, my - 1) || on(mx, my + 1) ||
        on(mx - 1, my - 1) || on(mx + 1, my + 1) || on(mx - 1, my + 1) || on(mx + 1, my - 1))) px(mx, my, outline);
  for (let my = 0; my < h; my++) for (let mx = 0; mx < w; mx++)
    if (on(mx, my)) px(mx, my, highlight && !on(mx, my - 1) ? highlight : rows[Math.min(rows.length - 1, Math.floor(my / h * rows.length))]);
  return c;
}

  k: '#101018', s: '#f0b080', S: '#b87048', c: '#2838a0', C: '#5068d8',
  r: '#e84040', R: '#a02828', b: '#3050b0', B: '#1c2c70', w: '#f8f8f8',
  p: '#f8a8b8', P: '#d87088', g: '#505868', G: '#a0a8b8',
  m: '#e04890', l: '#f8a0c8', o: '#d88830', O: '#f8d080', y: '#d0d0e0',
  h: '#186030', H: '#30a050',
  n: '#7a4420', N: '#4a2810', v: '#9048c0', V: '#602c88',
  q: '#ff8878', u: '#5c84e0',
  z: '#1c1c26', Z: '#34344a', x: '#6a6a88',
};
function sprite(rows) {
  const w = Math.max(...rows.map(r => r.length));
  const [c, x] = makeCanvas(w, rows.length);
  rows.forEach((row, y) => [...row].forEach((ch, xx) => {
    if (PAL[ch]) { x.fillStyle = PAL[ch]; x.fillRect(xx, y, 1, 1); }
  }));
  return c;
}

// Seeded random so the still image is the same every load.
let seed = 7;
const rand = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;


// ---------- Portal (bird's-eye view down the tunnel) ----------
const CX = 120, CY = 80;
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
// Ramps go from deep (center) to near (edges).
const GREEN = ['#04140a', '#0a3018', '#107830', '#30c858', '#70ff90'].map(hex);
const BLUE  = ['#060a30', '#10248a', '#2850d8', '#58a0ff', '#a8d0ff'].map(hex);
const PURP  = ['#14062a', '#3a1078', '#6020b0', '#9848e8', '#d098ff'].map(hex);
const CORE  = hex('#e8fff0');

function drawPortal(target, zoom = 1) {
  const img = target.createImageData(W, H);
  const d = img.data;
  const maxR = Math.hypot(CX, CY);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const dx = (x - CX) / zoom, dy = (y - CY) / zoom;
    const nd = Math.hypot(dx, dy) / maxR;            // 0 center → 1 corner
    const a = Math.atan2(dy, dx);
    const dz = bayer(x, y);
    // Spiral arms twisting down the tunnel, plus depth rings.
    const arms = Math.sin(a * 3 + Math.log(nd + 0.02) * 6) + dz * 0.5;
    const arms2 = Math.sin(a * 2 - Math.log(nd + 0.02) * 4 + 1.7) + dz * 0.5;
    const rings = Math.sin(14 / (nd + 0.08));
    // Brightness: dark down the throat, bright toward the viewer, glowing pinpoint core.
    let lvl = Math.min(4, Math.max(0, Math.floor(nd * 4.6 + rings * 0.7 + dz * 1.2)));
    let ramp = GREEN;
    if (arms > 0.75) ramp = PURP;
    else if (arms2 > 0.7) ramp = BLUE;
    let col = ramp[lvl];
    const core = nd * 9 + dz * 0.8;
    if (core < 0.25) col = CORE;
    else if (core < 0.55) col = GREEN[4];
    else if (core < 0.85) col = GREEN[3];
    const i = (y * W + x) * 4;
    d[i] = col[0]; d[i + 1] = col[1]; d[i + 2] = col[2]; d[i + 3] = 255;
  }
  target.putImageData(img, 0, 0);
}

function drawThing(o) {

// ---------- The guy, in perspective ----------
// Camera looks straight down; he faces up at it, falling away into the portal
// and reaching toward the viewer — so hands are biggest, feet smallest.

// Draws one body part on its own layer, snaps edges to hard pixels and adds a dark outline.
function part(draw) {
  const [c, x] = makeCanvas(W, H);
  draw(x);
  const img = x.getImageData(0, 0, W, H), d = img.data;
  for (let i = 3; i < d.length; i += 4) d[i] = d[i] > 110 ? 255 : 0;
  const out = new Uint8ClampedArray(d);
  const solid = (px, py) => px >= 0 && py >= 0 && px < W && py < H && d[(py * W + px) * 4 + 3];
  for (let py = 0; py < H; py++) for (let px = 0; px < W; px++) {
    if (solid(px, py)) continue;
    if (solid(px - 1, py) || solid(px + 1, py) || solid(px, py - 1) || solid(px, py + 1)) {
      const i = (py * W + px) * 4;
      out[i] = 16; out[i + 1] = 16; out[i + 2] = 24; out[i + 3] = 255;
    }
  }
  x.putImageData(new ImageData(out, W, H), 0, 0);
  ctx.drawImage(c, 0, 0);
}
const poly = (x, pts, col) => {
  x.fillStyle = col; x.beginPath();
  pts.forEach(([a, b], i) => i ? x.lineTo(a, b) : x.moveTo(a, b));
  x.closePath(); x.fill();
};
const line = (x, x0, y0, x1, y1, w, col) => {
  x.strokeStyle = col; x.lineWidth = w; x.lineCap = 'round';
  x.beginPath(); x.moveTo(x0, y0); x.lineTo(x1, y1); x.stroke();
};
const disc = (x, cx, cy, r, col) => { x.fillStyle = col; x.beginPath(); x.arc(cx, cy, r, 0, Math.PI * 2); x.fill(); };
const mirror = pts => pts.map(([a, b]) => [240 - a, b]);

function drawGuy() {
  ctx.save();

  const legL = [[112, 92], [120, 96], [108, 110], [96, 108]];

      const a = dir + f * flip;
      line(x, cx, cy, cx + Math.cos(a) * len, cy + Math.sin(a) * len, w, '#f0b080');

    poly(x, [[124, 69], [134, 69], [128, 96], [120, 96]], '#a02828');
    // Shirt hem, darker, so it tucks into the jeans.

    poly(x, [[121, 90], [128, 90], [128, 92], [121, 92]], '#801c1c');
    // Waistband shaded to line up with the shirt and leg shading.
    poly(x, [[110, 92], [121, 92], [120, 96], [110, 96]], '#3050b0');
    poly(x, [[121, 92], [130, 92], [130, 96], [120, 96]], '#1c2c70');
    line(x, 109, 72, 106, 66, 8, '#e84040');
    line(x, 131, 72, 134, 66, 8, '#a02828');
  });
  for (const [cx, rot] of [[101, 0.5], [139, -0.5]]) {
    part(x => {
      x.save(); x.translate(cx, 112); x.rotate(rot);
      x.fillStyle = '#f8f8f8'; x.beginPath(); x.ellipse(0, 0, 6, 8.5, 0, 0, Math.PI * 2); x.fill();
      x.fillStyle = '#a0a8b8'; x.beginPath(); x.ellipse(0, 0.5, 4, 6.5, 0, 0, Math.PI * 2); x.fill();
      x.fillStyle = '#505868'; for (const ty of [-4, -1, 2, 5]) x.fillRect(-3, ty, 6, 1);
      x.restore();

  // Head: face turned up at the camera, cap turned to the side, mouth wide open.
  part(x => {
    disc(x, 120, 63, 12.5, '#f0b080');
    x.fillStyle = '#2838a0';
    x.beginPath(); x.arc(120, 63, 12.5, Math.PI * 1.08, Math.PI * 1.92); x.closePath(); x.fill();
    // brim sticking out sideways
    x.save(); x.translate(106, 56); x.rotate(-0.5);
    x.fillStyle = '#1c2878'; x.beginPath(); x.ellipse(0, 0, 7, 3.5, 0, 0, Math.PI * 2); x.fill();
    x.restore();
    x.fillStyle = '#5068d8'; x.fillRect(118, 53, 6, 1);
    x.fillStyle = '#b87048'; x.fillRect(108, 70, 3, 2); x.fillRect(129, 70, 3, 2);
  });
  // Face details, pixel by pixel.
  const px = (col, ...pts) => { ctx.fillStyle = col; for (let i = 0; i < pts.length; i += 2) ctx.fillRect(pts[i], pts[i + 1], 1, 1); };
  // wide eyes
  ctx.fillStyle = '#f8f8f8'; ctx.fillRect(113, 61, 4, 4); ctx.fillRect(123, 61, 4, 4);
  ctx.fillStyle = '#101018'; ctx.fillRect(114, 62, 2, 2); ctx.fillRect(124, 62, 2, 2);
  // raised, panicked eyebrows
  px('#101018', 112, 59, 113, 58, 114, 58, 115, 58, 125, 58, 126, 58, 127, 58, 128, 59);
  // screaming mouth
  ctx.fillStyle = '#101018'; ctx.fillRect(116, 67, 8, 7);
  ctx.fillStyle = '#6a1020'; ctx.fillRect(117, 68, 6, 5);
  ctx.fillStyle = '#f8f8f8'; ctx.fillRect(117, 68, 6, 1);
  ctx.fillStyle = '#e05070'; ctx.fillRect(118, 71, 4, 2);
  px('#101018', 116, 67, 123, 67, 116, 73, 123, 73);
  px('#f0b080', 116, 67, 123, 67);
  // palm creases
  px('#b87048', 89, 45, 90, 46, 91, 46, 92, 47, 151, 45, 150, 46, 149, 46, 148, 47);
  ctx.restore();
}

const selectTitleImg = renderText('SELECT SAVE', LOGO);

const SLOT_W = 102, SLOT_H = 50, CHAMFER = 5;
const SLOTS = [[12, 36], [126, 36], [12, 93], [126, 93]];
const GROW_W = 8, GROW_H = 4; // how much a slot grows while hovered

// Inside test for a rectangle with clipped corners.
function inChamfer(x, y, w, h, c) {
  if (x < 0 || y < 0 || x >= w || y >= h) return false;
  const dx = Math.min(x, w - 1 - x), dy = Math.min(y, h - 1 - y);
  return dx + dy >= c;
}

// Pre-render each slot: lavender crayon-streaked panel with a peach progress band.
// Each slot gets a normal and a slightly bigger hovered version, drawn crisp at both sizes.
function makeSlot(i, w, h) {
  const [c, x] = makeCanvas(w, h);
  const band = h - 15;
  const put = (px, py, col) => { x.fillStyle = col; x.fillRect(px, py, 1, 1); };
  for (let py = 0; py < h; py++) for (let px = 0; px < w; px++) {
    if (!inChamfer(px, py, w, h, CHAMFER)) continue;
    if (!inChamfer(px - 1, py - 1, w - 2, h - 2, CHAMFER - 1)) {
      put(px, py, '#101018');
      continue;
    }
    const edgeTL = !inChamfer(px - 2, py - 2, w - 4, h - 4, CHAMFER - 1);
    // crayon-like streaks
    const v = Math.sin(py * 1.3 + Math.sin(px * 0.15) * 1.5) + bayer(px, py) * 0.6;
    let col;
    if (py === band) col = '#8078b8';
    else if (py > band) col = v > 0.6 ? '#ffd8b8' : v < -0.6 ? '#f0b080' : '#f8c8a0';
    else col = v > 0.6 ? '#d8d0f4' : v < -0.6 ? '#a8a0d8' : '#c0b8e8';
    if (edgeTL) col = px > w / 2 && py > h / 2 ? '#8078b8' : (py > band ? '#fff0e0' : '#ece8ff');
    put(px, py, col);
  }
  const label = renderText('SAVE ' + (i + 1), { rows: ['#302858'], outline: null });
  const prog = renderText('PROGRESS 0%', { rows: ['#603820'], outline: null });
  x.drawImage(label, 6 - 3, 5 - 3);
  x.drawImage(prog, 6 - 3, band + 4 - 3);
  return c;
}
const slotImgs = SLOTS.map((_, i) => makeSlot(i, SLOT_W, SLOT_H));
const slotBigImgs = SLOTS.map((_, i) => makeSlot(i, SLOT_W + GROW_W, SLOT_H + GROW_H));

let hover = -1, chosenAt = null;

function renderSelect(now) {
  ctx.drawImage(selectBg, 0, 0);
  ctx.drawImage(selectTitleImg, Math.round((W - selectTitleImg.width) / 2), 4);
  SLOTS.forEach(([sx, sy], i) => { if (i !== hover) ctx.drawImage(slotImgs[i], sx, sy); });
  if (hover >= 0) {
    // Hovered slot pops out a little bigger, with a glowing frame; flashes white once clicked.
    const w = SLOT_W + GROW_W, h = SLOT_H + GROW_H;
    const sx = SLOTS[hover][0] - GROW_W / 2, sy = SLOTS[hover][1] - GROW_H / 2;
    ctx.drawImage(slotBigImgs[hover], sx, sy);
    const blink = Math.floor(now / 300) % 2;
    const flashing = chosenAt !== null && Math.floor((now - chosenAt) / 80) % 2 === 0;
    const cols = flashing ? ['#ffffff', '#ffffff'] : blink ? ['#70ff90', '#30c858'] : ['#a0ffb8', '#70ff90'];
    for (let py = -3; py < h + 3; py++) for (let px = -3; px < w + 3; px++) {
      if (inChamfer(px, py, w, h, CHAMFER)) continue;
      if (inChamfer(px + 1, py + 1, w + 2, h + 2, CHAMFER + 1)) ctx.fillStyle = cols[0];
      else if (inChamfer(px + 3, py + 3, w + 6, h + 6, CHAMFER + 2)) ctx.fillStyle = cols[1];
      else continue;
      ctx.fillRect(sx + px, sy + py, 1, 1);
    }
  }
  ctx.drawImage(hintImg, Math.round((W - hintImg.width) / 2), 147);
}

// ---------- Shared drawing helpers ----------
// Pixel-exact filled shape with a 1px outline. `inside(px, py)` defines the shape.
function shape(t, x0, y0, w, h, inside, fill, outline = '#101018') {
  for (let py = 0; py < h; py++) for (let px = 0; px < w; px++) {
    if (!inside(px, py)) continue;
    const edge = !inside(px - 1, py) || !inside(px + 1, py) || !inside(px, py - 1) || !inside(px, py + 1);
    t.fillStyle = edge ? outline : (typeof fill === 'function' ? fill(x0 + px, y0 + py) : fill);
    t.fillRect(x0 + px, y0 + py, 1, 1);
  }
}
// Box with clipped corners.
function cbox(t, x0, y0, w, h, c, fill, outline) {
  shape(t, x0, y0, w, h, (px, py) => inChamfer(px, py, w, h, c), fill, outline);
}
// Crayon-streak fills.
const streak = (lo, mid, hi, k = 1.3) => (x, y) => {
  const v = Math.sin(y * k + Math.sin(x * 0.15) * 1.5) + bayer(x, y) * 0.6;
  return v > 0.6 ? hi : v < -0.6 ? lo : mid;
};
const LAVENDER = streak('#a8a0d8', '#c0b8e8', '#d8d0f4');
const PEACH = streak('#f0b080', '#f8c8a0', '#ffd8b8');
const MINT = streak('#70ff90', '#a0ffb8', '#c8ffd0');
const WHITE = '#ffffff';

const panelCache = new Map();
function panel(w, h, fill, c = 4) {
  const id = typeof fill === 'string' ? fill : (fill.id ??= Math.random().toString(36).slice(2));
  const key = [w, h, c, id].join();
  if (!panelCache.has(key)) {
    const [pc, px] = makeCanvas(w, h);
    cbox(px, 0, 0, w, h, c, fill);
    panelCache.set(key, pc);
  }
  return panelCache.get(key);
}

const textCache = new Map();
function textImg(str, opts) {
  const key = str + '|' + JSON.stringify(opts);
  if (!textCache.has(key)) textCache.set(key, renderText(str, opts));
  return textCache.get(key);
}
// renderText pads by 3px; these place the glyphs themselves.
const drawAt = (img, x, y) => ctx.drawImage(img, x - 3, y - 3);
const drawCentered = (img, cx, y) => ctx.drawImage(img, Math.round(cx - (img.width - 6) / 2) - 3, y - 3);
const INK = { rows: ['#101018'], outline: null };
const DARK = { rows: ['#302858'], outline: null };
const LIGHT = { rows: ['#ffffff', '#c8ffd0'] };

// ---------- Name entry ----------
const NAME_MAX = 8;
let playerName = '', saveSlot = 0, confirmSel = 0;
const nameTitleImg = renderText('SELECT YOUR NAME', LOGO);
const NAME_BOX = [36, 50, 168, 44];
const CONFIRM_BOX = [56, 102, 128, 50];
const BUTTONS = [[70, 126, 44, 18], [126, 126, 44, 18]]; // YES, NO

function renderName(now) {
  ctx.drawImage(selectBg, 0, 0);
  ctx.drawImage(nameTitleImg, Math.round((W - nameTitleImg.width) / 2), 4);
  const [bx, by, bw, bh] = NAME_BOX;
  ctx.drawImage(panel(bw, bh, LAVENDER), bx, by);
  // One underline per letter; the next empty one blinks green.
  const x0 = W / 2 - (NAME_MAX * 12 - 2) / 2;
  for (let i = 0; i < NAME_MAX; i++) {
    const next = state === 'name' && i === playerName.length && Math.floor(now / 400) % 2 === 0;
    ctx.fillStyle = next ? '#30c858' : '#8078b8';
    ctx.fillRect(x0 + i * 12, by + 32, 10, 2);
  }
  if (playerName) drawAt(textImg(playerName, { scale: 2, gap: 2, rows: ['#302858'], outline: null }), x0, by + 14);

  if (state === 'confirm') {
    const [cx, cy, cw, ch] = CONFIRM_BOX;
    ctx.drawImage(panel(cw, ch, LAVENDER), cx, cy);
    drawCentered(textImg('ARE YOU SURE?', DARK), W / 2, cy + 8);
    ['YES', 'NO'].forEach((label, i) => {
      const [x, y, w, h] = BUTTONS[i];
      ctx.drawImage(panel(w, h, i === confirmSel ? MINT : PEACH), x, y);
      drawCentered(textImg(label, DARK), x + w / 2, y + 6);
    });
  } else {
    drawCentered(textImg('TYPE YOUR NAME, THEN PRESS ENTER', LIGHT), W / 2, 104);
  }
}

function nameKey(e) {
  if (/^Key[A-Z]$/.test(e.code)) { if (playerName.length < NAME_MAX) { playerName += e.code[3]; sfx.type(); } }
  else if (e.code === 'Space') {
    if (playerName && !playerName.endsWith(' ') && playerName.length < NAME_MAX) playerName += ' ';
  }
  else if (e.code === 'Backspace') { if (playerName) sfx.type(true); playerName = playerName.slice(0, -1); }
  else if (e.code === 'Enter') {
    if (e.repeat || !playerName.trim()) return;
    playerName = playerName.trim();
    confirmSel = 0;
    state = 'confirm';
    sfx.select();
  }
  else if (e.code === 'Escape') { playerName = ''; state = 'select'; }
  else return;
  e.preventDefault();
}

function confirmKey(e) {
  if (e.repeat) return;
  switch (e.code) {
    case 'ArrowLeft': case 'ArrowRight': case 'KeyA': case 'KeyD': confirmSel = 1 - confirmSel; sfx.blip(); break;
    case 'KeyY': confirmSel = 0; answerConfirm(); break;
    case 'KeyN': case 'Escape': confirmSel = 1; answerConfirm(); break;
    case 'Enter': case 'Space': answerConfirm(); break;
    default: return;
  }
  e.preventDefault();
}
function answerConfirm() {
  canvas.style.cursor = 'default';
  if (confirmSel === 0) { sfx.confirm(); startCutscene(); }
  else { sfx.back(); state = 'name'; }
}

// Fill that shades a box like Fusion sprites: light top/left edge, dark bottom/right, dithered body.
function bevel(ramp, x0, y0, w, h) {
  return (x, y) => {
    const lx = x - x0, ly = y - y0;
    if (ly <= 1) return ramp[3];
    if (lx <= 1) return ramp[3];
    if (ly >= h - 3 || lx >= w - 3) return ramp[0];
    if (ly >= h - 5 || lx >= w - 5) return ramp[1];
    return bayer(x, y) + Math.sin(x * 0.7 + y * 0.2) * 0.2 > 0.35 ? ramp[1] : ramp[2];
  };
}

// Night-time alley behind the house: brick walls, a dumpster with trash bags around it,

{

    put(x, y, mortar ? (shade ? '#8a7a70' : '#c8b8a8')

  // Dumpster: green metal, ribbed sides, lid on top, little wheels.

    put(x, y, ry === 0 ? '#c0c8d8' : ry === 1 ? '#101018' : (x % 6 === 0 || ry % 6 === 1) ? '#22293a' : bayer(x, y) > 0.5 ? '#3a4458' : '#465268');
  }
  // Blue hatch door on the left (back out to the street).
  sb(['#1a2030', '#2a3448', '#3a4864', '#5a6a8a'], 4, FLOOR_Y - 40, 24, 40, 0);
  sb(HATCH, 7, FLOOR_Y - 36, 18, 36, 1);
  for (let y = FLOOR_Y - 36; y < FLOOR_Y; y++) { put(15, y, '#101018'); put(16, y, '#101018'); }
  for (let x = 11; x < 21; x++) put(x, FLOOR_Y - 39, '#40e0ff');
  // Computer console with a green screen.
  const consoleAt = (x, w) => {
    sb(STEEL, x, FLOOR_Y - 18, w, 18, 1);
    sb(['#101420', '#1a2030', '#2a3448', '#4a5670'], x + 4, FLOOR_Y - 46, w - 8, 26, 1);
    for (let y = FLOOR_Y - 42; y < FLOOR_Y - 24; y++) for (let xx = x + 7; xx < x + w - 7; xx++) put(xx, y, bayer(xx, y) > 0.8 ? '#104a20' : '#0a3a1a');
    for (let r = 0; r < 4; r++) {
      const len = 6 + ((x * 7 + r * 13) % (w - 22));
      for (let xx = 0; xx < len; xx++) put(x + 9 + xx, FLOOR_Y - 40 + r * 4, '#40e060');
    }
    [['#ff4040', 6], ['#40e040', 10], ['#f8d040', 14]].forEach(([c, ox]) => { put(x + ox, FLOOR_Y - 13, c); put(x + ox + 1, FLOOR_Y - 13, c); });
    for (let xx = x + w - 20; xx < x + w - 6; xx += 2) put(xx, FLOOR_Y - 12, '#a0b0d0');
  };
  consoleAt(42, 44);
  consoleAt(160, 56);
  // Glass tubes of bubbling green goo (one has a pig in it).
  for (const [tx, pig] of [[100, true], [128, false]]) {
    sb(STEEL, tx, 46, 22, 8, 1);
    sb(STEEL, tx, FLOOR_Y - 10, 22, 10, 1);
    for (let y = 54; y < FLOOR_Y - 10; y++) for (let x = tx + 2; x < tx + 20; x++) {
      const lx = x - tx;
      put(x, y, lx === 2 || lx === 19 ? '#0e3a20' : lx === 4 || lx === 5 ? '#c8ffd8' : y < 60 ? '#1a5a38' : bayer(x, y) > 0.5 ? '#30c060' : '#20a050');
    }
    if (pig) lbx.drawImage(SPR.pig, tx + 4, 84);
    for (const [bx, by] of [[9, 70], [14, 104], [8, 116], [15, 64], [11, 90]]) { put(tx + bx, by, '#a0ffc0'); put(tx + bx + 1, by - 1, '#e0fff0'); }
  }
  // A big portal-ring machine, like the one in the alley.
  const RX = 278, RY = 90, RO = 28, RI = 20;
  for (let y = RY - RO; y <= RY + RO; y++) for (let x = RX - RO; x <= RX + RO; x++) {
    const d = Math.hypot(x - RX, y - RY);
    if (d > RO) continue;
    if (d < RI) { put(x, y, bayer(x, y) < 0.3 + Math.sin(Math.atan2(y - RY, x - RX) * 3 + d * 0.4) * 0.2 ? '#7030c0' : '#20103a'); continue; }
    const edge = d > RO - 1 || d < RI + 1;
    const lit = (x - RX) + (y - RY) < 0;
    put(x, y, edge ? '#101018' : lit ? (bayer(x, y) > 0.4 ? STEEL[3] : STEEL[2]) : (bayer(x, y) > 0.4 ? STEEL[1] : STEEL[2]));
  }
  for (let i = 0; i < 8; i++) {
    const a = i * Math.PI / 4;
    put(Math.round(RX + Math.cos(a) * 24), Math.round(RY + Math.sin(a) * 24), '#f8e080');
  }
  sb(STEEL, RX - 22, FLOOR_Y - 16, 44, 16, 1);
  put(RX - 8, FLOOR_Y - 9, '#ff3030'); put(RX - 7, FLOOR_Y - 9, '#ff3030');
  put(RX + 6, FLOOR_Y - 9, '#40e040'); put(RX + 7, FLOOR_Y - 9, '#40e040');
}

function wrapText(text, max) {
  const lines = [];
  for (const word of text.split(' ')) {
    const last = lines[lines.length - 1];
    if (last !== undefined && (last + ' ' + word).length <= max) lines[lines.length - 1] = last + ' ' + word;
    else lines.push(word);
  }
  return lines;
}

const GOLD = { rows: ['#fff0a0', '#f8d040', '#e0a820'], outline: '#000000' };
// Dialogue waits for Enter once a box has finished typing.
let enterQueued = false;
function lineDone(shown, len) {
  if (shown < len) { enterQueued = false; return false; }   // no pressing ahead while it types
  const go = enterQueued;
  enterQueued = false;
  if (go) sfx.blip();
  return go;
}
function drawCaption(speaker, text, shown) {
  const lines = wrapText(text, 34);
  const w = W - 16, h = lines.length * 10 + 20;
  ctx.globalAlpha = 0.72;
  ctx.drawImage(panel(w, h, '#06060e', 4), 8, 4);
  ctx.globalAlpha = 1;
  drawAt(textImg(speaker, { rows: ['#ffffff', '#c8ffd0'], outline: '#000000' }), 16, 9);
  let offset = 0;
  lines.forEach((line, i) => {
    const n = Math.max(0, Math.min(line.length, shown - offset));
    offset += line.length + 1;
    if (!n) return;
    const img = textImg(line, GOLD);
    ctx.drawImage(img, 0, 0, 3 + n * 6, img.height, 16 - 3, 20 + i * 10 - 3, 3 + n * 6, img.height);
  });
  if (shown >= text.length && Math.floor(performance.now() / 300) % 2) {
    // Blinking arrow: press Enter.
    const ax = 8 + w - 14, ay = 4 + h - 10;
    ctx.fillStyle = '#f8d040';
    for (let r = 0; r < 4; r++) ctx.fillRect(ax + r, ay + r, 7 - r * 2, 1);
  }
}

function updateThrow(dt) {

function drawThrow() {

// ---------- Particles (dust puffs, sparks) ----------
let particles = [];
function burst(x, y, colors, n, speed = 40) {
  for (let i = 0; i < n; i++) particles.push({
    x, y, vx: (Math.random() - 0.5) * speed * 2, vy: -Math.random() * speed,
    c: colors[i % colors.length], life: 0.5 + Math.random() * 0.3,
  });
}
function updateParticles(dt) {
  for (const q of particles) { q.vy += 200 * dt; q.x += q.vx * dt; q.y += q.vy * dt; q.life -= dt; }
  particles = particles.filter(q => q.life > 0);
}
function drawParticles() {
  for (const q of particles) {
    if (q.life < 0.15 && Math.floor(q.life * 40) % 2) continue; // flicker out
    ctx.fillStyle = q.c;
    ctx.fillRect(Math.round(q.x - camX), Math.round(q.y), 1, 1);
  }
}

// ---------- Cutscene (plays itself; any key skips) then platforming ----------
const COUCH_X = 199, MOM_STOP = 128;
const WALK_SPEED = 38, RUN_SPEED = 72, GRAVITY = 820, JUMP_VEL = -290;
let cut, player, mom, camX = 0, held = new Set(), hintUntil = 0, fadeInT = 0;

function makePlayer() {
  return { x: COUCH_X, y: FLOOR_Y, vx: 0, vy: 0, onGround: true, sitting: true, flip: false,
           walkT: 0, hp: 5, maxHp: 5, hurtT: 0, carrying: false };
}

function startCutscene() {
  state = 'cutscene';
  camX = 0;
  particles = [];
  TRASH.taken = false;
  thrown = null; lidT = 0; trashDone = false; ringSceneIn = 0; ringScene = null;
  momPraised = false; exitOpen = false; exitOpenT = 0; praise = null;
  toast = null;
  room = 'living';
  doorT = null;
  cut = { phase: 'fade', t: 0, speaker: '', text: '', shown: 0, hold: 0 };
  player = makePlayer();
  mom = { x: -10, y: FLOOR_Y, flip: false, walkT: 0, moving: false };
}

function say(speaker, text, hold) {
  Object.assign(cut, { phase: 'talk', speaker, text, shown: 0, hold, t: 0 });
}

// Hand control to the player (end of cutscene, or skipped).
function beginPlay() {
  state = 'play';
  cut.phase = 'done';
  player.sitting = false;
  player.y = FLOOR_Y;
  player.vy = JUMP_VEL * 0.5;        // hops off the couch
  player.onGround = false;
  burst(player.x, FLOOR_Y, DUST, 6, 25);
  sfx.jump();
  if (mom) { mom.x = Math.max(mom.x, 40); mom.leaving = true; }
  fadeInT = 0.4;
  hintUntil = performance.now() + 4500;
}

function updateCutscene(dt) {
  cut.t += dt;
  if (cut.phase === 'fade' && cut.t > 0.8) { cut.phase = 'momIn'; cut.t = 0; }
  else if (cut.phase === 'momIn') {
    mom.x += WALK_SPEED * dt; mom.walkT += dt; mom.moving = true;
    momSteps(mom);
    if (mom.x >= MOM_STOP) {
      mom.x = MOM_STOP; mom.moving = false;
      say('MOM', `HEY ${playerName}, WHY DON'T YOU GET OFF YOUR BUTT AND TAKE OUT THE TRASH?`, 2.5);
    }
  } else if (cut.phase === 'talk') {
    mom.moving = false;
    const prev = cut.shown;
    cut.shown = Math.min(cut.text.length, cut.t * 30);
    voiceBlips(prev, cut.shown, cut.text, cut.speaker === 'MOM');
    if (lineDone(cut.shown, cut.text.length)) {
      if (cut.speaker === 'MOM') say(playerName, 'OK MOM', 1.4);
      else { cut.phase = 'outro'; cut.t = 0; }
    }
  } else if (cut.phase === 'outro' && cut.t > 0.5) beginPlay();
}

function hurt(dir) {
  player.hp -= 1;
  player.hurtT = 1.2;
  player.vx = dir * 120;
  player.vy = -180;
  player.onGround = false;
  burst(player.x, player.y - 20, ['#ff4040', '#f8a040', '#ffffff'], 10, 60);
  if (player.hp <= 0) {
    // Back to the couch with full hearts.
    Object.assign(player, { x: COUCH_X, y: FLOOR_Y, vx: 0, vy: 0, hp: player.maxHp, hurtT: 1.5 });
    fadeInT = 0.4;
  }
}

function updatePlay(dt) {
  const p = player;
  if (doorT) { updateDoor(dt); updateParticles(0); return; }
  updateThrow(dt);
  const left = held.has('ArrowLeft'), right = held.has('ArrowRight');
  if (p.hurtT > 0.9) { /* knocked back: no control for a moment */ }
  else if (left && !right) { p.vx = -RUN_SPEED; p.flip = true; }
  else if (right && !left) { p.vx = RUN_SPEED; p.flip = false; }
  else p.vx *= Math.pow(0.65, dt * 60);
  if ((held.has('ArrowUp') || held.has('Space')) && p.onGround) {
    p.vy = JUMP_VEL;
    p.onGround = false;
    burst(p.x, p.y, DUST, 5, 25);
    sfx.jump();
  }
  p.hurtT = Math.max(0, p.hurtT - dt);

  p.vy += GRAVITY * dt;
  const prevY = p.y;
  // The door to town is locked, so it works as a wall.
  const rightWall = room === 'living' && exitOpen ? LEVEL_W - 6 : curRoom().rightWall;
  p.x = Math.max(6, Math.min(rightWall, p.x + p.vx * dt));
  // Walking into the open front door takes you out into town.
  if (room === 'living' && exitOpen && p.x >= LEVEL_W - 8) goThrough('town', TOWN_HOME_X + 14, false);
  // Getting close to the scientist at the end of the third street starts his scene.
  if (room === 'town3' && !bossDone && !doorT && p.x >= SCI_X - 90) { startBossScene(); return; }
  // Walking off either end of a street takes you to the next neighborhood.
  if (curRoom().right && p.x >= curRoom().rightWall) goThrough(curRoom().right, 14, false, false);
  else if (curRoom().left && p.x <= 6) goThrough(curRoom().left, ROOMS[curRoom().left].w - 14, true, false);
  p.y += p.vy * dt;
  const wasOnGround = p.onGround;
  p.onGround = false;
  if (p.vy >= 0) {
    // Land on the highest one-way platform we crossed this frame.
    let best = null;
    for (const pl of curRoom().platforms)
      if (p.x + 3 > pl.x && p.x - 3 < pl.x + pl.w && prevY <= pl.y + 0.5 && p.y >= pl.y && (!best || pl.y < best.y)) best = pl;
    if (best) {
      p.y = best.y;
      if (!wasOnGround && p.vy > 150) { burst(p.x, p.y, DUST, 4, 25); sfx.land(); }
      p.vy = 0;
      p.onGround = true;
    }
  }
  if (p.onGround && Math.abs(p.vx) > 5) { p.walkT += dt; guySteps(p); }


  if (mom && mom.leaving) {
    mom.x -= WALK_SPEED * dt; mom.walkT += dt; mom.moving = true; mom.flip = true;
    momSteps(mom);
    if (mom.x < LIVING_DOOR_X) mom = null;     // out through the door
  }

  // Camera: follow with a lead, eased, clamped to the level.
  const target = Math.max(0, Math.min(curRoom().w - W, p.x - W * 0.35));
  camX += (target - camX) * (1 - Math.pow(0.9, dt * 60));
}

function renderLevel(now) {
  const cx = Math.round(camX);
  if (room === 'town3' && (portalOn || (boss && boss.twist > 0))) drawPortalBg(now, portalOn ? 1 : boss.twist);
  else ctx.drawImage(curRoom().bg, cx, 0, W, H, 0, 0, W, H);
  if (room === 'living') drawExitOpen();
  if (room === 'living' && !TRASH.taken) ctx.drawImage(BAG, Math.round(TRASH.x - camX) - 9, TRASH.y - BAG.height);
  if (room === 'alley')
    ALLEY_BAGS.forEach(([bx, by], i) => {
      ctx.save();
      ctx.translate(Math.round(bx - camX), by);
      if (i % 2) ctx.scale(-1, 1);
      ctx.drawImage(BAG, -9, -BAG.height);
      ctx.restore();
    });
  const chars = [];
  if (mom) chars.push({ img: mom.moving && Math.floor(mom.walkT / 0.15) % 2 ? MOM_WALK : MOM_STAND, ...mom });
  const p = player;
  const blinking = p.hurtT > 0 && Math.floor(p.hurtT * 12) % 2;
  if (!blinking) {
    let img = GUY_STAND;
    if (p.pose === 'reach') img = GUY_REACH;
    else if (p.sitting) img = GUY_SIT;
    else if (!p.onGround) img = GUY_JUMP;
    else if (Math.abs(p.vx) > 5) {
      const f = Math.floor(p.walkT / 0.08) % GUY_WALK_FRAMES.length;
      img = GUY_WALK_FRAMES[f];
    }
    if (p.flash) img = flashSprite(img);
    chars.push({ img, ...p, x: p.x + (p.shakeX || 0), y: p.sitting ? FLOOR_Y - 4 : p.y });
    // Carried trash bag slung over his shoulder, behind his head.
    if (p.carrying) ctx.drawImage(BAG, Math.round(p.x - camX + (p.flip ? -1 : -17)), Math.round(p.y - 34));
  }
  if (room === 'town3') { drawFloaters(); drawLabOutside(); drawSci(); }
  if (doc.room === room) chars.unshift({ img: doc.moving && Math.floor(doc.walkT / 0.15) % 2 ? DOC_WALK : DOC_STAND, ...doc, y: FLOOR_Y });
  chars.forEach(c => drawChar(c.img, c.x, c.y, c.flip));
  if (state === 'boss' && boss.phase === 'toLab') drawLabWallFront();
  if (room === 'alley') drawThrow();
  if (room === 'living') drawDaylight();
  drawParticles();

  if (state === 'cutscene') {
    if (cut.phase === 'talk') drawCaption(cut.speaker, cut.text, Math.floor(cut.shown));
    // Stepped fades in and out of black.
    const fade = cut.phase === 'fade' ? 1 - cut.t / 0.8 : cut.phase === 'outro' ? cut.t / 0.5 : 0;
    if (fade > 0) {
      ctx.globalAlpha = Math.min(1, Math.ceil(fade * 4) / 4);
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }
  } else if (state === 'praise') {
    drawPraiseScene();
  } else if (state === 'ringScene') {
    drawRingScene(now);
  } else if (state === 'boss') {
    drawBossScene();
  } else if (state === 'labScene') {
    drawLabScene();
  } else {
    drawInteractPrompt(now);
    drawToast(now);
    drawHUD(now);
    if (now < hintUntil) drawCentered(textImg('ARROWS: MOVE SPACE: JUMP E: USE', GOLD), W / 2, 30);
    if (doorT) {
      ctx.globalAlpha = Math.min(1, Math.ceil(doorT.t / 0.25 * 4) / 4);
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }
    if (fadeInT > 0) {
      ctx.globalAlpha = Math.ceil(fadeInT / 0.4 * 4) / 4;
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }
  }
}

// ---------- The Lord of Dimensions (end of the third street) ----------
// A super buff scientist with galaxy skin, four arms, a purple hat, a dark blue
// bandana, beige pants and a golden staff. Built from shaded shapes, so every

const SCI_X = 880;                         // where he stands

function sciBody(raised) {

  };

  const hash = (x, y) => { const h = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453; return h - Math.floor(h); };
  const GAL = ['#100a2c', '#281860', '#4430a0', '#7058d8'];

  const TEAL = ['#06203a', '#0c4068', '#18709a', '#38a8d0'];

  const BOOT = ['#1a0c08', '#3a2014', '#5a3420', '#7a4c30'];
  const GOLDR = ['#5a4208', '#a07c10', '#d8b040', '#f8e080'];
  const GEM = ['#300c48', '#6a1c90', '#a848e0', '#f0b0ff'];
  const HAT = ['#2a0c40', '#521c78', '#8030b0', '#b060e0'];
  const BAND = ['#14061e', '#2a0c40', '#3e1460', '#521c78'];
  const BANDANA = ['#060c28', '#0c1a50', '#18307a', '#2c4ca8'];
  const PINK = ['#6a2a6a', '#a84898', '#e078c8', '#f8b0e8'];

    P(ell(staffX, staffTop, 4, 1.8), ramp(GOLDR), '#3a2804'),                 // prongs
    P(ell(staffX, staffTop - 3, 3.4, 3.4), ramp(GEM), '#1a0428'),             // purple gem
  ];
  const lowerArm = m => {   // hand on hip
    const X = x => 50 + m * (x - 50);
    return [
      P(cap(X(41), 33, X(33), 40, 4.5, 4), galaxy), P(ell(X(36), 36, 5, 4), galaxy),
      P(cap(X(33), 40, X(40), 45, 4, 3.5), galaxy),
      P(ell(X(41), 45.5, 3.2, 3), galaxy),

  };

      P(cap(X(31), 22, X(27), 33, 6, 5), galaxy),               // upper arm
      P(ell(X(28), 27, 6.5, 7), galaxy),                        // bicep
      P(cap(X(27), 34, X(26), 45, 4.5, 3.5), galaxy),           // forearm
      P(ell(X(26.5), 38, 5, 5.5), galaxy),

  const raisedArm = [
    P(ell(65, 20, 8, 7), galaxy),
    P(cap(68, 19, 77, 9, 6, 5), galaxy), P(ell(73, 14, 6.5, 5.5), galaxy),
    P(cap(77, 9, 80, -2, 4.5, 3.5), galaxy), P(ell(78.5, 3, 4.5, 4.5), galaxy),
    ...staff, P(ell(80, -4, 3.8, 3.5), galaxy),

  const crown = cap(50, 2, 53, -11, 7, 4);

    P(cap(45, 47, 43, 63, 5.5, 4.5), ramp(BEIGE), '#2a2010'),       // legs
    P(cap(55, 47, 57, 63, 5.5, 4.5), ramp(BEIGE), '#2a2010'),
    P(ell(42, 64.5, 6, 2.6), ramp(BOOT)), P(ell(58, 64.5, 6, 2.6), ramp(BOOT)),
    P(ell(50, 46, 11, 5), ramp(BEIGE), '#2a2010'),                  // hips
    P(cap(47.5, 44, 47, 49, 0.6), ramp(BEIGE), '#5a4a30'),          // drawstrings
    P(cap(52.5, 44, 53, 49, 0.6), ramp(BEIGE), '#5a4a30'),
    P(sq(50, 42, 11, 1.9), ramp(BOOT)),                             // belt
    P(sq(50, 42, 2.2, 1.9), ramp(GOLDR), '#3a2804'),                // buckle
    P(lats, galaxy),
    P(abs, (x, y, t) => (Math.round(y) % 3 === 0 || Math.round(x) === 50) ? GAL[Math.max(0, t - 2)] : galaxy(x, y, t)),
    P(ell(50, 17, 13, 5), galaxy),                                  // traps
    ...lowerArm(1), ...lowerArm(-1),

    P(and(sashLine, torso), (x, y, t) => ((x - 37) + (y - 17) + bayer(Math.floor(x), Math.floor(y)) * 8 < 26 ? SKY : PINK)[t], '#3a1440'),
    P(ell(50, 15, 5, 3), galaxy),                                   // neck
    P(head, galaxy),
    P(and(or(head, cap(50, 14, 50, 17.5, 3.5, 1)), (x, y) => y >= 10.5 ? [0, 0] : null), ramp(BANDANA), '#02040e'),  // bandana
    P(cap(56, 10, 60, 14, 1.4, 0.8), ramp(BANDANA), '#02040e'),   // knot tail
    P(crown, ramp(HAT), '#140620'),
    P(and(crown, (x, y) => y >= -1.5 && y <= 1.5 ? [0, 0] : null), ramp(BAND), '#0a0210'),
    P(ell(50, 3.5, 12.5, 2.5), ramp(HAT), '#140620'),               // brim
  ];
}
function paintSci(raised) {
  const [c, g] = makeCanvas(SCI_W, SCI_H);
  const L = [-0.45, -0.6, 0.66];
  for (const pt of sciBody(raised)) {
    const hit = (x, y) => pt.hit(x + 0.5 - SCI_OX, y + 0.5 - SCI_OY);
    for (let y = 0; y < SCI_H; y++) for (let x = 0; x < SCI_W; x++) {
      const n = hit(x, y);
      if (!n) continue;
      const edge = !hit(x - 1, y) || !hit(x + 1, y) || !hit(x, y - 1) || !hit(x, y + 1);
      let col;
      if (edge) col = pt.line;
      else {
        const nz = Math.sqrt(Math.max(0, 1 - n[0] * n[0] - n[1] * n[1]));
        const l = Math.max(0, L[0] * n[0] + L[1] * n[1] + L[2] * nz);
        const t = Math.max(0, Math.min(3, Math.floor(l * 3.6 + bayer(x, y) - 0.3)));
        col = pt.fill(x - SCI_OX + 0.5, y - SCI_OY + 0.5, t);
      }
      g.fillStyle = col; g.fillRect(x, y, 1, 1);
    }
  }
  // Glowing yellow eyes above the bandana.
  for (const ex of [47, 52]) {
    g.fillStyle = '#ffe040'; g.fillRect(ex + SCI_OX, 8 + SCI_OY, 2, 1);
    g.fillStyle = '#ff9020'; g.fillRect(ex + SCI_OX, 9 + SCI_OY, 2, 1);
  }

}
const SCI_IDLE = paintSci(false), SCI_RAISE = paintSci(true);
const sciWorld = (bx, by) => [SCI_X + bx - 50, FLOOR_Y - 67 + by];   // body coords -> world

// ---------- Cutscene: meeting the Lord of Dimensions ----------
let boss = null, bossDone = false, portalOn = false;
const BOSS_LINES = {
  talk1: 'HELLO CHILD. I AM THE LORD OF DIMENSIONS.',
  talk2: 'AND YOU ARE JUST IN TIME TO WATCH ME TAKE OVER THE MULTIVERSE.',
  talk3: 'NOW... STAND STILL.',
  talk4: "WELL, I'M OFF. BYE!",
  doc1: "HOW DID YOU SURVIVE? IT DOESN'T MATTER.",
  doc2: 'NOW QUICKLY! WE MUST GET TO THE LAB BEFORE WE DE-STABILIZE!',
};
const lineSpeaker = phase => phase.startsWith('doc') ? 'SCIENTIST' : 'LORD OF DIMENSIONS';
function startBossScene() {
  state = 'boss';
  held.clear();
  Object.assign(player, { vx: 0, flip: false, pose: null });
  camX = SCI_X - 160;
  boss = { phase: 'face', t: 0, zoom: 4, fx: 0, fy: 0, pose: 'idle', spin: 0, gone: false, twist: 0, shown: 0, dust: [], shake: 0 };
  sfx.drone();
}
function bossVoice(prev, shown, text) {
  for (let i = Math.floor(prev); i < Math.floor(shown); i++)
    if (i % 2 === 0 && text[i] !== ' ') tone({ f0: 110 + Math.random() * 30, dur: 0.07, vol: 0.07 });
}
function updateBossScene(dt) {
  const b = boss;
  b.t += dt;
  const next = phase => { b.phase = phase; b.t = 0; b.shown = 0; };
  const ease = t => t * t * (3 - 2 * t);
  b.shake = 0;
  if (b.phase === 'face') {
    // Close-up on his face, then pull back to show all of him.
    [b.fx, b.fy] = sciWorld(51, 0);
    if (b.t > 1.5) { next('zoomout'); sfx.sting(); }
  } else if (b.phase === 'zoomout') {
    const f = ease(Math.min(1, b.t / 1.6));
    const [hx, hy] = sciWorld(51, 0);
    b.zoom = Math.pow(4, 1 - f);
    b.fx = hx + (camX + W / 2 - hx) * f; b.fy = hy + (H / 2 - hy) * f;
    if (b.t > 2.1) { b.zoom = 1; next('talk1'); }
  } else if (b.phase in BOSS_LINES) {
    const text = BOSS_LINES[b.phase], prev = b.shown;
    b.shown = Math.min(text.length, b.t * 26);
    if (b.phase.startsWith('doc')) voiceBlips(prev, b.shown, text, false);
    else bossVoice(prev, b.shown, text);
    if (b.phase === 'talk4') b.pose = 'idle';
    if (lineDone(b.shown, text.length)) {
      if (b.phase === 'talk1') next('talk2');
      else if (b.phase === 'talk2') next('talk3');
      else if (b.phase === 'talk3') { next('raise'); sfx.raise(); }
      else if (b.phase === 'talk4') { next('spin'); sfx.spin(); }
      else if (b.phase === 'doc1') next('doc2');
      else next('toLab');
    }
  } else if (b.phase === 'raise') {
    // Up goes the golden staff, glowing and throwing sparks.
    if (b.t > 0.25) b.pose = 'raise';
    if (b.t > 0.4 && Math.random() < 0.6) {
      const [ox, oy] = sciWorld(80, -27);
      burst(ox, oy, ['#fff8c0', '#f8d040', '#f0b0ff'], 2, 50);
    }
    if (b.t > 1.6) { next('twist'); sfx.twist(); }
  } else if (b.phase === 'twist') {
    // The whole world twists around him into a fiery portal.
    b.twist = Math.min(1, b.t / 3);
    b.shake = b.t < 3 ? 1 : 0;
    if (Math.random() < 0.5) { const [ox, oy] = sciWorld(80, -27); burst(ox, oy, ['#fff8c0', '#f8d040'], 1, 40); }
    if (b.t > 3.8) { portalOn = true; next('talk4'); }
  } else if (b.phase === 'spin') {
    b.spin += dt * (6 + b.t * 30);
    if (b.t > 1.5) {
      // Poof! Purple and blue dust everywhere.
      b.gone = true;
      sfx.vanish();
      for (let n = 0; n < 220; n++) {
        const [x, y] = sciWorld(15 + Math.random() * 70, -10 + Math.random() * 76);
        const a = Math.random() * Math.PI * 2, sp = 10 + Math.random() * 60;
        b.dust.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 10, life: 1.2 + Math.random() * 1.6,
          c: ['#a848e0', '#7030c0', '#f0b0ff', '#3068e8', '#58a0ff', '#a0d8ff'][n % 6] });
      }
      next('poof');
    }
  } else if (b.phase === 'poof') {
    if (b.t > 2.5) next('docTurn');
  } else if (b.phase === 'docTurn') {
    // The scientist spins around to look at you.
    if (b.t > 0.4 && !doc.flip) { doc.flip = true; sfx.blip(); }
    if (b.t > 1) next('doc1');
  } else if (b.phase === 'toLab') {
    // Both of you hurry right, into the lab.
    const p = player;
    doc.flip = false; doc.moving = true; doc.walkT += dt; doc.x += RUN_SPEED * 0.8 * dt;
    if (b.t > 0.4) {
      p.x += RUN_SPEED * 0.8 * dt; p.vx = RUN_SPEED * 0.8; p.flip = false; p.walkT += dt;
      guySteps(p);
    }
    if (doc.x > LAB_DOOR_X - 40 && labDoorT === 0) sfx.whoosh();
    if (doc.x > LAB_DOOR_X - 40) labDoorT = Math.min(1, labDoorT + dt * 3);
    const target = Math.max(0, Math.min(TOWN3_W - W, p.x - W * 0.35));
    camX += (target - camX) * (1 - Math.pow(0.9, dt * 60));
    if (p.x > LAB_DOOR_X + LAB_DOOR_W - 4) {
      Object.assign(doc, { room: 'lab', x: 200, flip: true, moving: false });
      p.vx = 0;
      endBossScene();
      goThrough('lab', LAB_IN_DOOR_X + 18, false);
    }
  }
  for (const d of b.dust) { d.vx *= Math.pow(0.3, dt); d.vy = d.vy * Math.pow(0.3, dt) - 6 * dt; d.x += d.vx * dt; d.y += d.vy * dt; d.life -= dt; }
  b.dust = b.dust.filter(d => d.life > 0);
}
function endBossScene() {
  boss = null;
  bossDone = true;
  state = 'play';
}

// Swirling red, orange, yellow and purple portal (world-anchored around where he stood).
const portalImg = ctx.createImageData(W, H);
let twistSnap = null;
function drawPortalBg(now, amount) {
  const bg = curRoom().bg, cx = Math.round(camX);

  if (amount < 1 && !twistSnap) twistSnap = ctx.getImageData(0, 0, W, H).data;
  const src = twistSnap, out = portalImg.data;
  const [px, py] = sciWorld(50, 20), ox = px - camX, oy = py;

  const mix = Math.min(1, Math.max(0, (amount - 0.25) / 0.65));
  for (let y = 0; y < FLOOR_Y; y++) for (let x = 0; x < W; x++) {
    const dx = x - ox, dy = y - oy, r = Math.hypot(dx, dy), ang = Math.atan2(dy, dx);
    const i = (y * W + x) * 4;
    let c;
    if (bayer(x, y) < mix) {
      if (r < 6 + Math.sin(t * 6) * 1.5) c = [255, 244, 200];
      else {
        const sp = ang / (Math.PI * 2) + Math.log(r + 1) * 0.55 - t * 0.35;
        const f = sp * 4 - Math.floor(sp * 4);
        c = COLS[(Math.floor(sp * 4) % 4 + 4 + (f + bayer(x, y) * 0.35 > 1 ? 1 : 0)) % 4];
      }
    } else {
      // Twist the old view around the center, harder near the middle.
      const a = ang - amount * 5 * Math.max(0, 1 - r / 260);
      const sx = Math.round(ox + Math.cos(a) * r), sy = Math.round(oy + Math.sin(a) * r);
      const j = ((Math.max(0, Math.min(H - 1, sy)) * W) + Math.max(0, Math.min(W - 1, sx))) * 4;
      c = src ? [src[j], src[j + 1], src[j + 2]] : [0, 0, 0];
    }
    out[i] = c[0]; out[i + 1] = c[1]; out[i + 2] = c[2]; out[i + 3] = 255;
  }
  ctx.putImageData(portalImg, 0, 0, 0, 0, W, FLOOR_Y);
}

function drawSci() {
  if (!(room === 'town3') || bossDone || (boss && boss.gone)) return;
  const img = boss && boss.pose === 'raise' ? SCI_RAISE : SCI_IDLE;
  const sx = Math.cos(boss ? boss.spin : 0);
  ctx.save();
  ctx.translate(Math.round(SCI_X - camX), FLOOR_Y);
  ctx.scale(Math.abs(sx) < 0.08 ? 0.08 : sx, 1);
  ctx.drawImage(img, -SCI_W / 2, -SCI_H);
  ctx.restore();
  if (boss && boss.pose === 'raise' && !boss.gone) {
    // Glow around the gem on top of the staff.
    const [gx, gy] = sciWorld(80, -27);
    const r = 5 + Math.sin(performance.now() / 70) * 1.5;
    for (let y = -10; y <= 10; y++) for (let x = -10; x <= 10; x++) {
      const d = Math.hypot(x, y);
      if (d > 3 && d < r + 3 && bayer(x + 40, y + 40) < (r + 3 - d) / 6) {
        ctx.fillStyle = '#fff0a0'; ctx.fillRect(Math.round(gx - camX) + x, gy + y, 1, 1);
      }
    }
  }
}

const zoomBuf = makeCanvas(W, H);
function drawBossScene() {
  const b = boss;
  for (const d of b.dust) {
    if (d.life < 0.4 && Math.floor(d.life * 30) % 2) continue;
    ctx.fillStyle = d.c;
    ctx.fillRect(Math.round(d.x - camX), Math.round(d.y), d.life > 1.4 ? 2 : 1, d.life > 1.4 ? 2 : 1);
  }
  if (b.shake) {
    const zb = zoomBuf[1];
    zb.clearRect(0, 0, W, H); zb.drawImage(canvas, 0, 0);
    ctx.drawImage(zoomBuf[0], Math.round((Math.random() - 0.5) * 3), Math.round((Math.random() - 0.5) * 3));
  }
  if (b.zoom > 1.01) {
    // Camera close-up: blow up a small part of the frame.
    const zb = zoomBuf[1];
    zb.drawImage(canvas, 0, 0);
    const sw = W / b.zoom, sh = H / b.zoom;
    const sx = Math.max(0, Math.min(W - sw, b.fx - camX - sw / 2)), sy = Math.max(0, Math.min(H - sh, b.fy - sh / 2));
    ctx.drawImage(zoomBuf[0], sx, sy, sw, sh, 0, 0, W, H);
    // Letterbox bars for the dramatic close-up.
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, 12); ctx.fillRect(0, H - 12, W, 12);
  }
  if (b.phase in BOSS_LINES) drawCaption(lineSpeaker(b.phase), BOSS_LINES[b.phase], Math.floor(b.shown));
}

// ---------- Cutscene: the scientist explains things in the lab ----------
// [speaker, text, yelled?]  (null speaker = you)
const LAB_LINES = [
  ['SCIENTIST', "NOW WE CAN'T GO BACK OUT ANYMORE."],
  ['SCIENTIST', 'IF YOU DO, IT CAN ONLY BE A FEW SECONDS BEFORE YOU BECOME INTERDIMENSIONALLY LOCKED LIKE THE OTHERS.'],
  ['SCIENTIST', 'NOW I MUST ASK, HOW DID YOU SURVIVE?'],
  [null, "I DON'T KNOW. I TOOK OUT THE TRASH AND GOT ZAPPED BY THIS RING THING, THEN THE..."],
  ['SCIENTIST', 'AH-HA! YOU GOT ZAPPED BY OUR PROTOTYPE OF OUR INTERDIMENSIONAL GROUNDER.', true],
  ['SCIENTIST', "WE THOUGHT IT DIDN'T WORK, BUT TURNS OUT WE WERE MISTAKEN."],
  ['SCIENTIST', 'COME, WE HAVE MUCH TO SHOW YOU.'],
];
const DOC_TALK_X = 74, DOC_LAB_X = 200;
let labScene = null, labTalked = false;
function startLabScene() {
  state = 'labScene';
  held.clear();
  Object.assign(player, { vx: 0, flip: false });
  labScene = { phase: 'walk', t: 0, i: 0, shown: 0, shake: false };
}
function updateLabScene(dt) {
  const sc = labScene;
  sc.t += dt;
  sc.shake = false;
  if (sc.phase === 'walk') {
    // He comes over to you.
    if (sc.t < 0.5) return;
    Object.assign(doc, { flip: true, moving: true });
    doc.x -= WALK_SPEED * dt; doc.walkT += dt; momSteps(doc);
    if (doc.x <= DOC_TALK_X) { Object.assign(doc, { x: DOC_TALK_X, moving: false }); sc.phase = 'talk'; sc.t = 0; }
  } else if (sc.phase === 'talk') {
    const [who, text, yell] = LAB_LINES[sc.i], prev = sc.shown;
    if (yell && sc.t < 0.05 && !sc.yelled) { sc.yelled = true; sfx.ahha(); }
    sc.shake = !!yell && sc.t < 0.6;
    sc.shown = Math.min(text.length, sc.t * (yell ? 40 : 30));
    voiceBlips(prev, sc.shown, text, false);
    if (lineDone(sc.shown, text.length)) {
      sc.i++; sc.t = 0; sc.shown = 0; sc.yelled = false;
      if (sc.i >= LAB_LINES.length) sc.phase = 'leave';
    }
  } else if (sc.phase === 'leave') {
    // "Come" - he heads back over to his computer.
    Object.assign(doc, { flip: false, moving: true });
    doc.x += WALK_SPEED * dt; doc.walkT += dt; momSteps(doc);
    if (doc.x >= DOC_LAB_X) {
      Object.assign(doc, { x: DOC_LAB_X, flip: true, moving: false });
      labScene = null;
      labTalked = true;
      state = 'play';
    }
  }
}
function drawLabScene() {
  const sc = labScene;
  if (sc.shake) {
    const zb = zoomBuf[1];
    zb.clearRect(0, 0, W, H); zb.drawImage(canvas, 0, 0);
    ctx.drawImage(zoomBuf[0], Math.round((Math.random() - 0.5) * 4), Math.round((Math.random() - 0.5) * 4));
  }
  if (sc.phase === 'talk') {
    const [who, text] = LAB_LINES[sc.i];
    drawCaption(who || playerName, text, Math.floor(sc.shown));
  }
  if (fadeInT > 0) {
    ctx.globalAlpha = Math.ceil(fadeInT / 0.4 * 4) / 4;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }
}

// ---------- Cutscene: he notices the ring, touches it, gets zapped ----------
const RING_TOUCH_X = 87;                // where he stands to touch the ring
let ringScene = null, ringTouched = false;

function startRingScene() {
  state = 'ringScene';
  held.clear();
  ringScene = { phase: 'notice', t: 0 };
  sfx.ding();
  Object.assign(player, { vx: 0, flip: player.x > RING.x, pose: null, shakeX: 0, flash: false });
}

function endRingScene() {
  Object.assign(player, { x: RING_TOUCH_X, y: FLOOR_Y, vx: 0, vy: 0, onGround: true, flip: true,
                          pose: null, shakeX: 0, flash: false });
  ringScene = null;
  ringTouched = true;
  state = 'play';
}

function updateRingScene(dt) {
  const sc = ringScene, p = player;
  sc.t += dt;
  const next = phase => { sc.phase = phase; sc.t = 0; };
  if (sc.phase === 'notice') {
    if (sc.t > 1.1) next('walk');
  } else if (sc.phase === 'walk') {
    const dir = Math.sign(RING_TOUCH_X - p.x);
    p.x += dir * WALK_SPEED * dt;
    p.vx = dir * WALK_SPEED;
    p.flip = dir < 0;
    p.walkT += dt;
    guySteps(p);
    if (dir === 0 || Math.sign(RING_TOUCH_X - p.x) !== dir) {
      Object.assign(p, { x: RING_TOUCH_X, vx: 0, flip: true });
      next('reach');
    }
  } else if (sc.phase === 'reach') {
    p.pose = 'reach';
    if (sc.t > 0.6) { next('zap'); sfx.zap(); }
  } else if (sc.phase === 'zap') {
    p.shakeX = Math.round((Math.random() - 0.5) * 3);
    p.flash = Math.floor(sc.t * 20) % 2 === 0;
    if (Math.random() < 0.5) burst(p.x - 5, p.y - 12, ['#ffffff', '#a8e8ff', '#58a0ff'], 2, 70);
    if (sc.t > 0.8) { p.pose = null; p.shakeX = 0; p.flash = false; next('field'); sfx.field(); }
  } else if (sc.phase === 'field') {
    if (sc.t > 1.8) next('done');
  } else if (sc.phase === 'done' && sc.t > 0.4) endRingScene();

  const target = Math.max(0, Math.min(curRoom().w - W, p.x - W * 0.5));
  camX += (target - camX) * (1 - Math.pow(0.9, dt * 60));
}

// Jagged electric bolt between two points.
function drawBolt(x0, y0, x1, y1) {
  const n = 6, pts = [[x0, y0]];
  for (let i = 1; i < n; i++) {
    const k = i / n;
    pts.push([x0 + (x1 - x0) * k + (Math.random() - 0.5) * 6, y0 + (y1 - y0) * k + (Math.random() - 0.5) * 6]);
  }
  pts.push([x1, y1]);
  for (const [col, w] of [['#58a0ff', 3], ['#ffffff', 1]]) {
    ctx.strokeStyle = col; ctx.lineWidth = w;
    ctx.beginPath();
    pts.forEach(([x, y], i) => i ? ctx.lineTo(Math.round(x - camX) + 0.5, Math.round(y) + 0.5) : ctx.moveTo(Math.round(x - camX) + 0.5, Math.round(y) + 0.5));
    ctx.stroke();
  }
}

function drawRingScene(now) {
  const sc = ringScene, p = player;
  if (sc.phase === 'notice') {
    // "!" pops up over his head.
    const pop = Math.min(1, sc.t / 0.15);
    const img = textImg('!', { scale: 2, gap: 0, bold: 1, rows: ['#ffffff', '#fff8a0', '#f8d040'], outline: '#101018' });
    ctx.drawImage(img, Math.round(p.x - camX) - 8, Math.round(p.y - 44 + (1 - pop) * 6));
  }
  if (sc.phase === 'zap') {
    const hx = p.x - 5, hy = p.y - 11;
    drawBolt(hx, hy, RING.x + 19, RING.y + 23);
    drawBolt(hx, hy, p.x + (Math.random() - 0.5) * 10, p.y - 22 - Math.random() * 6);
    if (Math.random() < 0.6) drawBolt(RING.x + 26, RING.y - 6, hx, hy);
    if (sc.t < 0.12) {   // white flash
      ctx.globalAlpha = 0.75;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }
  }
  if (sc.phase === 'field') {
    // Blue energy field around him, shimmering, then flickering out.
    const fadeStart = 1.2, k = sc.t < fadeStart ? 1 : 1 - (sc.t - fadeStart) / 0.6;
    const flickerOff = sc.t > fadeStart && Math.floor(sc.t * 18) % 2 === 0;
    if (!flickerOff && k > 0) {
      const cx = p.x - camX, cy = p.y - 13, rx = 14, ry = 19;
      const grow = Math.min(1, sc.t / 0.2);
      for (let y = Math.floor(cy - ry - 1); y <= cy + ry + 1; y++)
        for (let x = Math.floor(cx - rx - 1); x <= cx + rx + 1; x++) {
          const d = Math.hypot((x - cx) / (rx * grow), (y - cy) / (ry * grow));
          if (d > 1) continue;
          const wave = Math.sin(d * 10 - now / 70) * 0.25;
          if (d > 0.86) ctx.fillStyle = d > 0.94 ? '#ffffff' : '#a8e8ff';
          else if (bayer(x, y) + 0.5 < (0.25 + d * 0.35 + wave) * k) ctx.fillStyle = (x + y) % 3 ? '#58a0ff' : '#a8e8ff';
          else continue;
          ctx.fillRect(x, y, 1, 1);
        }
    }
  }
}

// ---------- Cutscene: Mom says good job, and the front door opens ----------
const MOM_WAIT_X = 150;
let praise = null, momPraised = false, exitOpen = false, exitOpenT = 0;

function startPraiseScene() {
  state = 'praise';
  held.clear();
  momPraised = true;
  praise = { phase: 'wait', t: 0, text: 'GOOD JOB HONEY, YOU CAN GO OUTSIDE NOW.', shown: 0 };
}

function endPraiseScene() {
  exitOpen = true;
  exitOpenT = 1;
  praise = null;
  state = 'play';
}

function updatePraiseScene(dt) {
  const sc = praise;
  sc.t += dt;
  const next = phase => { sc.phase = phase; sc.t = 0; };
  let camTarget = 0;
  if (sc.phase === 'wait') { if (sc.t > 0.5) next('talk'); }
  else if (sc.phase === 'talk') {
    const prev = sc.shown;
    sc.shown = Math.min(sc.text.length, sc.t * 30);
    voiceBlips(prev, sc.shown, sc.text, true);
    if (lineDone(sc.shown, sc.text.length)) next('open');
  } else if (sc.phase === 'open') {
    // Pan over to the front door and swing it open.
    camTarget = LEVEL_W - W;
    if (sc.t > 0.5 && !exitOpen) sfx.creak();
    if (sc.t > 0.5) { exitOpen = true; exitOpenT = Math.min(1, (sc.t - 0.5) / 0.6); }
    if (sc.t > 1.8) next('back');
  } else if (sc.phase === 'back') {
    camTarget = Math.max(0, Math.min(LEVEL_W - W, player.x - W * 0.35));
    if (sc.t > 0.6) endPraiseScene();
  }
  camX += (camTarget - camX) * (1 - Math.pow(0.9, dt * 60));
}

function drawPraiseScene() {
  if (praise.phase === 'talk') drawCaption('MOM', praise.text, Math.floor(praise.shown));
}

// The front door swinging open: the doorway is bright daylight.
function drawExitOpen() {
  if (!exitOpen) return;
  const x0 = Math.round(EXIT_X + 2 - camX), y0 = 88, w = LEVEL_W - EXIT_X - 2, h = FLOOR_Y - 88;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const edge = Math.min(x, y, h - 1 - y);
    ctx.fillStyle = edge > 2 || bayer(x, y) + 0.5 < edge / 3 ? '#ffffff' : '#fff4c8';
    ctx.fillRect(x0 + x, y0 + y, 1, 1);
  }
  // The door itself, narrowing as it swings inward.
  const dw = Math.max(3, Math.round(w * (1 - exitOpenT)));
  cbox(ctx, x0, y0, dw, h, 0, bevel(['#5a4208', '#a07c10', '#d8b040', '#f8e080'], x0, y0, dw, h));
}

// A soft glow of daylight from the open door, kept to the right side of the screen.
const LIGHT_W = Math.round(W * 0.4);
const [lightImg, lgx] = makeCanvas(LIGHT_W, H);
for (let y = 0; y < H; y++) for (let x = 0; x < LIGHT_W; x++) {
  const across = (x / LIGHT_W) ** 2;                           // stronger toward the door
  const fromDoor = Math.max(0, 1 - Math.abs(y - 110) / 90);      // centered on the doorway's height
  let k = across * (0.35 + fromDoor * 0.75);
  if (y > FLOOR_Y && x > LIGHT_W * 0.45) k += 0.25 * across;     // bright patch on the floor
  if (bayer(x, y) + 0.5 < k * 0.9) { lgx.fillStyle = k > 0.7 ? '#fff8e0' : '#ffe8a8'; lgx.fillRect(x, y, 1, 1); }
}
function drawDaylight() {
  if (!exitOpen) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.13 * exitOpenT;
  ctx.drawImage(lightImg, Math.round(EXIT_X + 2 - camX) - LIGHT_W, 0);
  ctx.restore();
}

// White silhouette of a sprite, for the zap flicker.
const flashCache = new Map();
function flashSprite(img) {
  if (!flashCache.has(img)) {
    const [c, x] = makeCanvas(img.width, img.height);
    x.drawImage(img, 0, 0);
    x.globalCompositeOperation = 'source-in';
    x.fillStyle = '#e8f8ff';
    x.fillRect(0, 0, img.width, img.height);
    flashCache.set(img, c);
  }
  return flashCache.get(img);
}

function updateLevel(dt) {
  if (state === 'cutscene') updateCutscene(dt);
  else if (state === 'ringScene') updateRingScene(dt);
  else if (state === 'praise') updatePraiseScene(dt);
  else if (state === 'boss') updateBossScene(dt);
  else if (state === 'labScene') updateLabScene(dt);
  else updatePlay(dt);
  fadeInT = Math.max(0, fadeInT - dt);
  updateParticles(dt);
}

function loadSave(i) {
  saveSlot = i;
  hover = -1;
  canvas.style.cursor = 'default';
  playerName = '';
  state = 'name';
}

// ---------- Screen flow ----------
let state = 'title';

// Title → dive into the portal → white flash → Select Save.
function start() {
  if (state !== 'title') return;
  state = 'diving';
  sfx.portal();
  const t0 = performance.now();
  (function dive(now) {
    const t = (now - t0) / 1000;
    if (t < 0.8) {
      drawPortal(ctx, 1 + t * t * 8);
      requestAnimationFrame(dive);
    } else if (t < 1.4) {
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, W, H);
      requestAnimationFrame(dive);
    } else {
      state = 'select';
    }
  })(t0);
}

function backToTitle() {
  state = 'title';
  hover = -1;
  canvas.style.cursor = 'default';
  render();
}

// One loop drives every screen after the title.
let lastFrame = performance.now();
function loop(now) {
  const dt = Math.min(0.05, Math.max(0, (now - lastFrame) / 1000));
  lastFrame = now;
  if (state === 'select') {
    renderSelect(now);
    if (chosenAt !== null && now - chosenAt > 700) {
      chosenAt = null;
      loadSave(hover);
    }
  } else if (state === 'name' || state === 'confirm') {
    renderName(now);
  } else if (state === 'cutscene' || state === 'play' || state === 'ringScene' || state === 'praise' || state === 'boss' || state === 'labScene') {
    updateLevel(dt);
    renderLevel(now);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

addEventListener('keydown', e => {
  if (state === 'title') { if (e.code === 'Space') { e.preventDefault(); start(); } }
  else if (state === 'select') { if (chosenAt === null && e.code === 'Escape') backToTitle(); }
  else if (state === 'name') nameKey(e);
  else if (state === 'confirm') confirmKey(e);
  else if (state === 'cutscene' || state === 'ringScene' || state === 'praise' || state === 'boss' || state === 'labScene') {
    // Cutscenes can't be skipped, but Enter moves on to the next dialogue box.
    if ((e.code === 'Enter' || e.code === 'NumpadEnter') && !e.repeat) enterQueued = true;
    if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault();
  } else if (state === 'play') {
    if (e.code.startsWith('Arrow') || e.code === 'Space') { e.preventDefault(); held.add(e.code); }
    else if (e.code === 'KeyE' && !e.repeat) interact();
  }
});
addEventListener('keyup', e => held.delete(e.code));
addEventListener('blur', () => held.clear());

function canvasPoint(e) {
  const r = canvas.getBoundingClientRect();
  return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H];
}
const within = ([x, y], [bx, by, bw, bh]) => x >= bx && x < bx + bw && y >= by && y < by + bh;

// Save slots and the YES/NO buttons are picked with the mouse.
function slotAt(e) {
  const pt = canvasPoint(e);
  return SLOTS.findIndex(([sx, sy]) => within(pt, [sx, sy, SLOT_W, SLOT_H]));
}
function buttonAt(e) {
  const pt = canvasPoint(e);
  return BUTTONS.findIndex(b => within(pt, b));
}
canvas.addEventListener('mousemove', e => {
  if (state === 'select' && chosenAt === null) {
    const h = slotAt(e);
    if (h >= 0 && h !== hover) sfx.blip();
    hover = h;
    canvas.style.cursor = hover >= 0 ? 'pointer' : 'default';
  } else if (state === 'confirm') {
    const b = buttonAt(e);
    if (b >= 0 && b !== confirmSel) sfx.blip();
    if (b >= 0) confirmSel = b;
    canvas.style.cursor = b >= 0 ? 'pointer' : 'default';
  }
});
canvas.addEventListener('mouseleave', () => {
  if (state === 'select' && chosenAt === null) hover = -1;
});
canvas.addEventListener('click', e => {
  if (state === 'title') return start();
  if (state === 'select' && chosenAt === null) {
    hover = slotAt(e);
    if (hover >= 0) { chosenAt = performance.now(); sfx.confirm(); }
  } else if (state === 'confirm') {
    const b = buttonAt(e);
    if (b >= 0) { confirmSel = b; answerConfirm(); }
  }
});
